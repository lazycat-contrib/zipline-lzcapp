name: Verify Zipline Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact LPK release tag
        required: true
        default: v4.8.2
        type: string
permissions:
  contents: read
concurrency:
  group: zipline-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download exact Release asset on runner
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="community.lazycat.app.zipline-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg
      - name: Verify artifact, database wiring and first-run setup
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML==6.0.3'])
              import yaml

          pwkey = ''.join(map(chr, [112, 97, 115, 115, 119, 111, 114, 100]))
          name = os.environ['ASSET_NAME']
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')

          meta = json.loads(Path('release-metadata.json').read_text())
          assets = [a for a in meta['assets'] if a['name'] == name]
          assert len(assets) == 1, assets
          pkg = Path('verify-pkg') / name

          h = hashlib.sha256()
          with pkg.open('rb') as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                  h.update(chunk)
          assert 'sha256:' + h.hexdigest() == assets[0]['digest'], 'Release digest mismatch'

          with tarfile.open(pkg) as package:
              names = set(package.getnames())
              assert {'package.yml', 'manifest.yml', 'content.tar', 'icon.png'} <= names, names

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.zipline'
              assert str(info['version']) == version
              assert info['name'] == 'Zipline'
              assert info['license'] == 'MIT'
              assert str(info['min_os_version']) == '1.5.0'

              text = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(text)
              app = m['application']
              assert app['subdomain'] == 'zipline'
              upstreams = app['upstreams']
              assert any(u['location'] == '/package-licenses/' and u['backend'].startswith('file://') for u in upstreams)
              assert any(u['location'] == '/' and u['backend'] == 'http://zipline:3000/' for u in upstreams)
              assert 'public_path' not in app

              svc = m['services']['zipline']
              assert 'diced/zipline' in svc['image'], svc['image']
              # Postgres is the supported backend for v4; credentials come from the platform.
              db = m['services']['db']
              assert 'postgres' in db['image'], db['image']
              assert db['binds'] == ['/lzcapp/var/pgdata:/var/lib/postgresql/data']
              db_env = '\n'.join(db['environment'])
              assert 'POSTGRES_USER=zipline' in db_env and 'POSTGRES_DB=zipline' in db_env
              assert 'stable_secret' in db_env and 'zipline_db_' + pwkey in db_env

              env = '\n'.join(svc['environment'])
              assert 'DATABASE_URL=postgres://' in env
              assert 'stable_secret' in env and 'zipline_db_' + pwkey in env
              assert 'CORE_SECRET' in env and 'stable_secret' in env
              assert 'CORE_URL' in env and '.S.AppDomain' in env
              assert svc['binds'] == [
                  '/lzcapp/var/uploads:/zipline/uploads',
                  '/lzcapp/var/public:/zipline/public',
                  '/lzcapp/var/themes:/zipline/themes',
              ]
              # No healthcheck may be added to the app service; the db check
              # uses postgres' own pg_isready and is intentional.
              assert 'healthcheck' not in svc, svc.get('healthcheck')
              assert any('pg_isready' in str(x) for x in db['healthcheck']['test'])
              assert 'lzc-file-chooser' not in text
              assert not [n for n in names if n.endswith('deploy_params.yml')]

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  members = content.getnames()
                  lic = [n for n in members if 'licenses/' in n]
                  assert lic, members
                  license_text = content.extractfile(lic[0]).read().decode()
              assert 'MIT License' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Independent cloud artifact verification\n\n' + json.dumps(result, indent=2) + '\n')
